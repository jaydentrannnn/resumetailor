<!doctype html><meta charset="utf-8">
<!-- Minimal, anonymized reconstruction of a Jobvite application page (2026-10): its final
     button reads "Send Application", and a "Save and finish later" link sits beside it. -->
<form class="jv-form">
  <label for="first">First Name</label><input id="first" type="text" required>
  <label for="email">Email</label><input id="email" type="email" required>
  <div class="jv-actions">
    <button type="button" class="jv-button-secondary">Save and finish later</button>
    <button type="submit" class="jv-button-primary">Send Application</button>
  </div>
</form>
