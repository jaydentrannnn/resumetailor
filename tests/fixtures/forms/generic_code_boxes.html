<!doctype html>
<!-- A six-box email code step on a site with no adapter: one code control. -->
<html><head><meta charset="utf-8"><title>Verify</title></head>
<body>
<h2>Check your email</h2>
<p>Enter the 6-digit code we sent you.</p>
<div class="code">
  <input type="text" maxlength="1" aria-label="Digit 1 of 6"><input type="text" maxlength="1" aria-label="Digit 2 of 6">
  <input type="text" maxlength="1" aria-label="Digit 3 of 6"><input type="text" maxlength="1" aria-label="Digit 4 of 6">
  <input type="text" maxlength="1" aria-label="Digit 5 of 6"><input type="text" maxlength="1" aria-label="Digit 6 of 6">
</div>
<button type="button">Verify</button> <a href="#resend">Resend code</a>
</body></html>
