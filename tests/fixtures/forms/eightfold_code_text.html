<!doctype html>
<!-- Minimal reconstruction of an Eightfold apply form (2026-10 probe) whose privacy text
     mentions a verification code: page text alone is not a code screen. -->
<html><head><meta charset="utf-8"><title>Apply</title></head>
<body>
<apply-widget>
  <h2>Apply</h2>
  <form>
    <label for="f">First name</label><input id="f" type="text">
    <label for="l">Last name</label><input id="l" type="text">
    <label for="e">Email</label><input id="e" type="email">
    <label for="ph">Phone</label><input id="ph" type="tel">
    <label for="c">Country</label><select id="c"><option>United States</option></select>
    <label for="r">Resume</label><input id="r" type="file">
    <fieldset><legend>Are you legally authorized to work in the United States?</legend>
      <label><input type="radio" name="auth" value="yes"> Yes</label>
      <label><input type="radio" name="auth" value="no"> No</label>
    </fieldset>
  </form>
  <p>After you apply we may email you a verification code to confirm your email address.
     Enter the one-time code from that email to view your application status.</p>
  <button type="button">Submit Application</button>
</apply-widget>
</body></html>
