<!doctype html>
<!-- Captured 2026-10-16 from careers.capgemini.com (SAP SuccessFactors career site), trimmed to
     the apply controls. The visible "Apply now" is a dropdown toggle that only opens a menu;
     its "Apply Now" item's script goes to the SuccessFactors sign-in. The toggle's own href,
     fetched directly, redirects to the site's home page. -->
<html lang="en-GB">
<head><meta charset="utf-8"><title>Graduate Software Engineering Programme 2027</title></head>
<body>
  <form role="search"><label>Search by Keyword <input name="q"></label>
    <label>Search by Location <input name="locationsearch"></label></form>
  <h1>Graduate Software Engineering Programme 2027</h1>
  <a xml:lang="en-GB" lang="en-GB" class="btn btn-primary btn-large btn-lg apply dialogApplyBtn "
     href="/talentcommunity/apply/1443172033/?locale=en_GB" style="display: none;">Apply now &raquo;</a>
  <div class="dropdown">
    <button class="btn btn-primary btn-large btn-lg dropdown-toggle" data-toggle="dropdown"
            aria-haspopup="true" aria-label="Apply now"
            href="/talentcommunity/apply/1443172033/?locale=en_GB" value=""
            onclick="document.getElementById('applyMenu').hidden = false">Apply now
      <span class="caret"></span></button>
    <ul id="applyMenu" role="menu" hidden>
      <li><a role="menuitem" href="#" id="applyOption-top-manual" aria-label="Apply Now"
             onclick="location.href = 'https://career5.successfactors.eu/careers?company=capgemitecP3'; return false">Apply Now</a></li>
      <li><a role="menuitem" href="#" aria-label="Start applying with LinkedIn"
             id="applyOption-top-linkedin">Start applying with LinkedIn</a></li>
    </ul>
  </div>
</body>
</html>
