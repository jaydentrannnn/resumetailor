<!doctype html>
<!-- Minimal reconstruction of an Avature portal's login step (2026-10 probe): one
     username box, one password box, a Log in button and a create-account link. -->
<html><head><meta charset="utf-8"><title>Login</title></head>
<body>
<portal-data hidden></portal-data>
<div class="cookie-banner"><p>We use cookies.</p><button>Allow All</button></div>
<main>
  <h2>Already registered? Log in</h2>
  <form>
    <label for="u">Username</label><input id="u" type="text" autocomplete="off">
    <label for="p">Password</label><input id="p" type="password" autocomplete="off">
    <button type="button">Log in</button>
  </form>
  <p>New here? <a href="#register">Create an account</a></p>
</main>
</body></html>
