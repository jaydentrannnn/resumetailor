<!doctype html>
<!-- Jobvite's data-consent step before the apply form (2026-10, reconstructed): one
     required "Location of Residence and Language" select in front of the real form. -->
<html><head><meta charset="utf-8"><title>Careers</title></head>
<body>
<div class="jv-page-content">
  <h2>Data Consent</h2>
  <form class="jv-form">
    <label for="jv-country-select">Location of Residence and Language:</label>
    <select id="jv-country-select" required>
      <option value="">Select your location of residence and language</option>
      <option value="a1">All Locations (English)</option>
    </select>
    <button type="button" class="jv-button">Next</button>
  </form>
</div>
</body></html>
