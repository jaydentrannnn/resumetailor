<!doctype html>
<!-- Jobvite apply form (2026-10, reconstructed): every field sits in a
     div.jv-form-field-control, which a loose "[class*='-control']" check took for a React
     Select box, so the scan reported no questions at all. -->
<html><head><meta charset="utf-8"><title>Apply</title></head>
<body>
<form class="jv-apply-form">
  <div class="jv-form-field"><div class="jv-form-field-input JVA_NAME">
    <label class="jv-form-field-label" for="jv-field-a1">First Name<span class="jv-required-label">*</span></label>
    <div class="jv-form-field-control"><input id="jv-field-a1" name="input-a1" type="text" autocomplete="given-name" aria-required="true" required></div>
  </div></div>
  <div class="jv-form-field"><div class="jv-form-field-input JVA_NAME">
    <label class="jv-form-field-label" for="jv-field-a2">Last Name<span class="jv-required-label">*</span></label>
    <div class="jv-form-field-control"><input id="jv-field-a2" name="input-a2" type="text" autocomplete="family-name" aria-required="true" required></div>
  </div></div>
  <div class="jv-form-field"><div class="jv-form-field-input JVA_EMAIL">
    <label class="jv-form-field-label" for="jv-field-a3">Email<span class="jv-required-label">*</span></label>
    <div class="jv-form-field-control"><input id="jv-field-a3" name="input-a3" type="text" autocomplete="email" aria-required="true" required></div>
  </div></div>
  <div class="jv-form-field"><div class="jv-form-field-input JVA_PHONE">
    <label class="jv-form-field-label" for="jv-field-a4">Cell Phone<span class="jv-required-label">*</span></label>
    <div class="jv-form-field-control"><input id="jv-field-a4" name="input-a4" type="tel" autocomplete="tel" aria-required="true" required></div>
  </div></div>
  <div class="jv-form-field"><div class="jv-form-field-input">
    <label class="jv-form-field-label" for="jv-field-a5">Country<span class="jv-required-label">*</span></label>
    <div class="jv-form-field-control"><select id="jv-field-a5" name="input-a5" autocomplete="country-name" required>
      <option value="">Select an option...</option><option>United States</option><option>Canada</option><option>United Kingdom</option>
    </select></div>
  </div></div>
  <div class="jv-form-field"><div class="jv-form-field-input">
    <label class="jv-form-field-label" for="jv-field-a6">State<span class="jv-required-label">*</span></label>
    <div class="jv-form-field-control"><select id="jv-field-a6" name="input-a6" autocomplete="address-level1" required>
      <option value="">Select an option...</option><option>Not Applicable</option><option>Alaska</option><option>California</option><option>Oregon</option>
    </select></div>
  </div></div>
  <div class="jv-form-field"><div class="jv-form-field-input">
    <label class="jv-form-field-label" for="jv-field-a7">Zip Code<span class="jv-required-label">*</span></label>
    <div class="jv-form-field-control"><input id="jv-field-a7" name="input-a7" type="text" autocomplete="postal-code" aria-required="true" required></div>
  </div></div>
  <button type="button" class="jv-button">Next</button>
</form>
</body></html>
