name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install --system -r requirements-dev.lock -e .
      - name: Ruff (advisory until the backlog is cleared)
        continue-on-error: true
        run: ruff check src tests
      - name: Mypy (advisory)
        continue-on-error: true
        run: mypy src
      - name: Tests
        run: python -m pytest -q

  hermetic:
    name: Hermetic (empty data dirs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install --system -r requirements-dev.lock -e .
      - name: Tests with empty data/templates roots
        run: |
          export RESUME_TAILOR_DATA_DIR="$(mktemp -d)"
          export RESUME_TAILOR_TEMPLATES_DIR="$(mktemp -d)"
          python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resumetailor:ci .
