name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install --system -r requirements-dev.lock -e .
      - name: Ruff (advisory until the backlog is cleared)
        continue-on-error: true
        run: ruff check src tests
      - name: Mypy (advisory)
        continue-on-error: true
        run: mypy src
      - name: Tests
        run: python -m pytest -q

  hermetic:
    name: Hermetic (empty data dirs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install --system -r requirements-dev.lock -e .
      - name: Tests with empty data/templates roots
        run: |
          export RESUME_TAILOR_DATA_DIR="$(mktemp -d)"
          export RESUME_TAILOR_TEMPLATES_DIR="$(mktemp -d)"
          python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install --system -r requirements-dev.lock -e .
      - run: npm test
        working-directory: extension
      - run: python -m pytest tests/test_extension_manifest.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: resumetailor-extension
          path: extension/

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: LibreOffice (page measurement) and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: uv pip install --system -r requirements-dev.lock -e .
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright (fake model, throwaway data)
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run e2e
      - name: Extension extraction in Chromium
        run: python -m pytest tests/test_extension_dom.py -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resumetailor:ci .
