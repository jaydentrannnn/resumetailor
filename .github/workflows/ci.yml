name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install -r requirements-dev.lock -e .
      - name: Ruff (advisory until the backlog is cleared)
        continue-on-error: true
        run: ruff check src tests
      - name: Mypy (advisory)
        continue-on-error: true
        run: mypy src
      - name: Tests
        run: python -m pytest -q

  hermetic:
    name: Hermetic (empty data dirs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install -r requirements-dev.lock -e .
      - name: Tests with empty data/templates roots
        run: |
          export RESUME_TAILOR_DATA_DIR="$(mktemp -d)"
          export RESUME_TAILOR_TEMPLATES_DIR="$(mktemp -d)"
          python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install -r requirements-dev.lock -e .
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: python -m pytest tests/extension/test_extension_manifest.py -q
      - name: Extension zip (as release.yml builds it)
        run: python extension/build_zip.py --out dist-extension
      - uses: actions/upload-artifact@v4
        with:
          name: resumetailor-extension
          path: dist-extension/*.zip

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: LibreOffice (page measurement) and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: uv pip install -r requirements-dev.lock -e .
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright (fake model, throwaway data)
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run e2e
      - name: Extension extraction in Chromium
        run: python -m pytest tests/extension/test_extension_dom.py -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK and tray libraries
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Icons and a stand-in server folder
        working-directory: desktop
        # The real server folder comes from PyInstaller in release.yml; the build script
        # only needs the resource path to exist.
        run: |
          npx --yes @tauri-apps/cli@2 icon app-icon.png
          mkdir -p sidecar/dist/resumetailor-server
      - working-directory: desktop/src-tauri
        run: cargo fmt --check && cargo test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resumetailor:ci .
