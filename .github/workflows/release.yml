name: Release

# Desktop installers (plan Phase 5, DK7). A `v*` tag builds the Python sidecar with
# PyInstaller, smoke-tests it, wraps it in the Tauri shell, and attaches the installers
# to a *draft* GitHub release for the owner to review and publish.
#
# In-app updates: every build signs its updater bundles with the key in the
# TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets, and a tag build also attaches
# `latest.json` (scripts/release_manifest.py). Installed apps read
# releases/latest/download/latest.json, which skips drafts: **publishing the draft is
# what ships the update.** The public half of the key is `plugins.updater.pubkey` in
# desktop/src-tauri/tauri.conf.json (docs/GUIDE.md §3 has the one-time setup).
#
# Windows installers are unsigned and show a SmartScreen warning. The macOS app
# has an ad hoc signature to avoid a "damaged" alert on Apple Silicon, but it is
# not notarized and may require approval in Privacy & Security before opening.
#
# Windows only by default. macOS runners bill 10x the minutes on a private repository,
# so the macOS build is opt-in: tick "Also build macOS" when running by hand, or set the
# repository variable RELEASE_MACOS=true for tag builds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: Also build macOS (Apple silicon)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  installer:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.macos || vars.RELEASE_MACOS == 'true') && '[{"name":"windows-x64","os":"windows-latest","bundles":"nsis,msi"},{"name":"macos-arm64","os":"macos-latest","bundles":"app,dmg"}]' || '[{"name":"windows-x64","os":"windows-latest","bundles":"nsis,msi"}]') }}
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Updater key configured
        # Without both halves the build fails late (tauri) or ships an app that can
        # never verify an update; fail here with the fix instead.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q REPLACE_WITH_PUBLIC_KEY desktop/src-tauri/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in desktop/src-tauri/tauri.conf.json (docs/GUIDE.md §3)."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (docs/GUIDE.md §3)."
            exit 1
          fi

      - name: Python dependencies
        run: uv pip install -r requirements.lock -e . pyinstaller
      - name: Web UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Sidecar (PyInstaller)
        run: >
          pyinstaller desktop/sidecar/resumetailor.spec --noconfirm
          --distpath desktop/sidecar/dist --workpath build/pyinstaller
      - name: Sidecar smoke test
        shell: bash
        run: |
          exe=desktop/sidecar/dist/resumetailor-server/resumetailor-server
          [ -f "$exe.exe" ] && exe="$exe.exe"
          python desktop/sidecar/smoke.py "$exe"

      - name: Version from the tag
        # Installers upgrade in place only when the version goes up; v1.2.3 -> 1.2.3.
        # MSI needs plain numbers (major <= 255), so no "-beta" suffixes on tags.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: >
          node -e "const f='desktop/src-tauri/tauri.conf.json';
          const c=JSON.parse(require('fs').readFileSync(f,'utf8'));
          c.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');
          require('fs').writeFileSync(f, JSON.stringify(c, null, 2));
          console.log('version', c.version)"
      - name: License and third-party notices
        # Next to the server in the install folder (bundle.resources ships this folder).
        shell: bash
        run: |
          python scripts/third_party_notices.py --require-cargo             --out desktop/sidecar/dist/resumetailor-server/THIRD-PARTY-NOTICES.txt
          cp LICENSE desktop/sidecar/dist/resumetailor-server/LICENSE.txt
      - name: Icons
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 icon app-icon.png
      - name: Shell (Tauri)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Verify macOS app signature
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: codesign --verify --deep --strict --verbose=2 desktop/src-tauri/target/release/bundle/macos/ResumeTailor.app

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          bundle=desktop/src-tauri/target/release/bundle
          for f in "$bundle"/nsis/*.exe "$bundle"/msi/*.msi "$bundle"/dmg/*.dmg; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            out="dist-installers/${name%.*}-${{ matrix.name }}.${name##*.}"
            cp "$f" "$out"
            # The updater signature, renamed to match (release_manifest.py pairs them).
            [ -f "$f.sig" ] && cp "$f.sig" "$out.sig"
          done
          # macOS updates install from the .app archive, not the .dmg.
          for f in "$bundle"/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            cp "$f" dist-installers/
            [ -f "$f.sig" ] && cp "$f.sig" dist-installers/
          done
          ls -l dist-installers
          [ -n "$(ls dist-installers)" ]
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist-installers/
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-installers/*

  extension:
    # The browser extension zip, one per release (it is the same on every platform).
    # Its manifest version is stamped from the tag so the extension and app match.
    name: Browser extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Extension tests
        working-directory: extension
        run: npm ci && npm test
      - name: Build the zip
        shell: bash
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python extension/build_zip.py ${version:+--version "$version"} --out dist-extension
          ls -l dist-extension
      - uses: actions/upload-artifact@v4
        with:
          name: resumetailor-extension
          path: dist-extension/*.zip
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-extension/*.zip

  manifest:
    # latest.json for in-app updates, from every platform's signed bundles.
    name: Updater manifest
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist-installers
          merge-multiple: true
      - name: Release notes from the tag message
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt
          cat notes.txt
      - name: Write latest.json
        run: >
          python scripts/release_manifest.py --tag "$GITHUB_REF_NAME"
          --dir dist-installers --repo "$GITHUB_REPOSITORY"
          --notes-file notes.txt --out latest.json
      - name: Attach to the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: latest.json
