<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResumeTailor</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f5; --ink: #1d1d1b; --muted: #6b6b66; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161615; --ink: #ededea; --muted: #a3a39c; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
             color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 32rem; padding: 0 16px; text-align: center; }
      p { color: var(--muted); }
      code { user-select: all; word-break: break-all; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <!-- Shown while the local server starts; the shell then navigates to it. -->
    <main id="starting" aria-live="polite">
      <h1>ResumeTailor</h1>
      <p>Starting…</p>
    </main>
    <main id="failed" hidden role="alert">
      <h1>ResumeTailor could not start</h1>
      <p>The local server stopped several times in a row. Quit and open ResumeTailor again.
        If it keeps happening, the log in this folder says why:</p>
      <p><code id="logs"></code></p>
    </main>
    <script>
      if (location.hash === "#failed") {
        document.getElementById("starting").hidden = true;
        document.getElementById("failed").hidden = false;
        window.__TAURI__?.core
          .invoke("log_folder")
          .then((path) => (document.getElementById("logs").textContent = path))
          .catch(() => {});
      }
    </script>
  </body>
</html>
