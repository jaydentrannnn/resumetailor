[package]
name = "resumetailor-desktop"
version = "0.1.0"
description = "ResumeTailor desktop shell: starts the local server and shows it in a window"
edition = "2021"
publish = false

[lib]
name = "resumetailor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
