<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/src/assets/logo-mark-black.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeTailor</title>
    <!-- Apply data-theme and accent before paint so stored overrides do not flash. -->
    <script>
      (function () {
        try {
          var p = window.__RT_DESKTOP_THEME__ || localStorage.getItem("resume-tailor-theme") || "system";
          var dark =
            p === "dark" ||
            (p !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var accent =
            typeof window.__RT_DESKTOP_ACCENT__ === "string"
              ? window.__RT_DESKTOP_ACCENT__
              : localStorage.getItem("resume-tailor-accent");
          if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
            document.documentElement.setAttribute("data-accent", "");
            document.documentElement.style.setProperty("--rt-accent-base", accent);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #ffffff; color: #0b0b0b; }
      html[data-theme="dark"] { background: #0a0a0a; color: #f5f5f4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
