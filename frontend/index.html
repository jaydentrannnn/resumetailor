<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/src/assets/logo-mark-black.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeTailor</title>
    <!-- Apply data-theme before paint so a stored Light override doesn't flash OS-dark tokens. -->
    <script>
      (function () {
        try {
          var p = window.__RT_DESKTOP_THEME__ || localStorage.getItem("resume-tailor-theme") || "system";
          var dark =
            p === "dark" ||
            (p !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #ffffff; color: #0b0b0b; }
      html[data-theme="dark"] { background: #0a0a0a; color: #f5f5f4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
