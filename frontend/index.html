<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>R</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeTailor</title>
    <!-- Apply data-theme before paint so a stored Light override doesn't flash OS-dark tokens. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("resume-tailor-theme") || "system";
          var dark =
            p === "dark" ||
            (p !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
