# ResumeTailor web UI — one service, a few clicks.
#
# Prerequisites: Docker Desktop running, .env with ANTHROPIC_API_KEY, and the
# gitignored data/ + templates/ directories present (master_resume.json and the
# tagged main_template.docx).
#
#   docker compose up --build
#   open http://localhost:8000
#
# Remote access via Cloudflare Tunnel is opt-in and gated behind a compose profile
# (a plain `docker compose up` never starts it, token or no token):
#
#   docker compose --profile cloudflare up --build
#
# or set COMPOSE_PROFILES=cloudflare in .env to fold it into the plain command above.
# Either way also needs CLOUDFLARE_TUNNEL_TOKEN set in .env (see .env.example). See
# README.md's "Remote access" section for the one-time Cloudflare dashboard setup.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback-only: LAN/internet reach this only through the cloudflared tunnel
      # below, never via a directly published port.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Reach Ollama / LM Studio on the Windows/macOS host from inside the container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      # Local rewrite batches often exceed five minutes; override via .env if needed.
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      RESUME_TAILOR_PDF_BACKEND: soffice
      RESUME_TAILOR_CACHE_DIR: /app/output/cache
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Behind the "cloudflare" profile — excluded from a plain `docker compose up`
  # entirely, not just skipped at runtime (see the top-of-file comment). See
  # README.md's "Remote access" section for creating the tunnel + Access policy in the
  # Cloudflare dashboard. Outbound-only connection to Cloudflare's edge, so it needs no
  # published port of its own.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      # cloudflared reads this natively; kept out of the command line so it never shows
      # up in `docker inspect` / a process listing. No ":?" required-var guard here —
      # that fails compose's variable interpolation for the *whole file*, even when
      # this profile isn't active, breaking the plain `docker compose up` path for
      # everyone. A missing token instead shows up as a connection failure in
      # `docker compose logs cloudflared` (see README.md's verification steps).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
