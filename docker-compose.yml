# ResumeTailor web UI — one service, a few clicks.
#
# Prerequisites: Docker Desktop running, .env with ANTHROPIC_API_KEY, and the
# gitignored data/ + templates/ directories present (master_resume.json and the
# tagged main_template.docx).
#
#   docker compose up --build
#   open http://localhost:8000

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Reach Ollama / LM Studio on the Windows/macOS host from inside the container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      # Local rewrite batches often exceed five minutes; override via .env if needed.
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      RESUME_TAILOR_PDF_BACKEND: soffice
      RESUME_TAILOR_CACHE_DIR: /app/output/cache
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
